id: cruise
label: 巡航
icon: cruise_control
order: 2
remote_configurable: true
description: 纵向控制、限速与巡航行为
sections:
- id: alpha_longitudinal
  title: Alpha 纵向控制
  description: ''
  items:
  - key: AlphaLongitudinalEnabled
    widget: toggle
    needs_onroad_cycle: true
    blocked: true
    title: zoompilot 纵向控制（Alpha）
    description: 警告：zoompilot 纵向控制在当前车型上为 Alpha 版，可能导致自动紧急制动（AEB）失效。当前车型默认使用车辆自带 ACC 而非 zoompilot 纵向控制。开启此项以切换到 zoompilot 纵向控制。车辆上电状态下更改此设置将重启 zoompilot。
    visibility:
    - type: capability
      field: alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ExperimentalModeSetSpeed
    widget: toggle
    title: 设定车速辅助
    description: 当驾驶模型减速时，按传统 Chill 模式的方式驶向设定车速和跟车距离。模型仍会执行每一次减速。
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: ExperimentalMode
    widget: toggle
    title: 驾驶模型控制油门刹车
    description: 默认开启。由驾驶模型像人类一样自主控制油门和刹车，包括在红灯和停车标志前停车。关闭即传统 Chill 模式：保持设定车速并跟随前车。
    enablement:
    - $ref: '#/macros/longitudinal'
- id: core_cruise_features
  title: ''
  description: ''
  items:
  - key: DisengageOnAccelerator
    widget: toggle
    title: 踩油门退出巡航
    description: 开启后踩油门踏板将退出纵向控制。
  - key: LongitudinalPersonality
    widget: multiple_button
    title: 驾驶个性
    description: 推荐标准模式。激进模式下 sunnypilot 油门刹车都更贴近前车、跟车更激进。放松模式下会与前车保持更远距离。支持的车型上可用方向盘车距键循环切换这些个性。
    options:
    - value: 0
      label: 激进
    - value: 1
      label: 标准
    - value: 2
      label: 放松
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: AccelPersonalityEnabled
    widget: toggle
    title: 启用油门控制器
    description: 选择 sunnypilot 起步、追赶与稳定到巡航车速的方式。紧急制动与停车行为不变。
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: AccelPersonality
    widget: multiple_button
    title: 加速风格
    description: 经济最柔和；标准在快速起步与平顺追赶间平衡；运动更积极响应。
    options:
    - value: 0
      label: 经济
    - value: 1
      label: 标准
    - value: 2
      label: 运动
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: IntelligentCruiseButtonManagement
    widget: toggle
    title: 智能巡航按键管理（ICBM）（Alpha）
    visibility:
    - type: capability
      field: icbm_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - type: not
      condition:
        type: capability
        field: has_longitudinal_control
        equals: true
- id: custom_acc_increments
  title: 自定义 ACC 速度档位
  description: ''
  enablement:
  - type: any
    conditions:
    - type: all
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: not
        condition:
          type: capability
          field: pcm_cruise
          equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: CustomAccIncrementsEnabled
    widget: toggle
    title: 启用自定义 ACC 速度档位
    enablement:
    - type: any
      conditions:
      - type: all
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: not
          condition:
            type: capability
            field: pcm_cruise
            equals: true
      - type: capability
        field: has_icbm
        equals: true
    - $ref: '#/macros/icbm_feature_not_engaged'
  sub_panels:
  - id: custom_acc_intervals
    label: 自定义 ACC 速度档位设置
    trigger_key: CustomAccIncrementsEnabled
    trigger_condition:
      type: param
      key: CustomAccIncrementsEnabled
      equals: true
    items:
    - key: CustomAccShortPressIncrement
      widget: option
      title: 短按步进
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
    - key: CustomAccLongPressIncrement
      widget: option
      title: 长按步进
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
- id: speed_limits
  title: 限速
  description: 限速识别与偏移行为
  items: []
  sub_panels:
  - id: speed_limit_settings
    label: 限速设置
    trigger_key: SpeedLimitMode
    items:
    - key: SpeedLimitMode
      widget: multiple_button
      title: 限速辅助模式
      options:
      - value: 0
        label: 关
      - value: 1
        label: 信息
      - value: 2
        label: 警告
      - value: 3
        label: 辅助
        enablement:
        - type: any
          conditions:
          - type: not_engaged
          - type: param
            key: SpeedLimitMode
            equals: 3
          - type: capability
            field: has_icbm
            equals: false
        - type: any
          conditions:
          - type: capability
            field: has_longitudinal_control
            equals: true
          - type: capability
            field: has_icbm
            equals: true
        - type: not
          condition:
            type: capability
            field: brand
            equals: rivian
        - type: not
          condition:
            type: all
            conditions:
            - type: capability
              field: brand
              equals: tesla
            - type: capability
              field: is_sp_release
              equals: true
    - key: SpeedLimitPolicy
      widget: multiple_button
      title: 限速来源
      options:
      - value: 0
        label: 仅车辆信号
      - value: 1
        label: 仅地图数据
      - value: 2
        label: 车辆信号优先
      - value: 3
        label: 地图数据优先
      - value: 4
        label: 组合
    - key: SpeedLimitOffsetType
      widget: multiple_button
      title: 限速偏移类型
      options:
      - value: 0
        label: 关
      - value: 1
        label: 固定
      - value: 2
        label: 百分比
    - key: SpeedLimitValueOffset
      widget: option
      title: 限速偏移值
      min: -30
      max: 30
      step: 1
      unit:
        metric: km/h
        imperial: mph
      visibility:
      - type: param_compare
        key: SpeedLimitOffsetType
        op: '>'
        value: 0
- id: smart_cruise
  title: 智能巡航控制
  description: ''
  enablement:
  - type: any
    conditions:
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: SmartCruiseControlVision
    widget: toggle
    title: 视觉
    description: 用视觉路径预测估算前方弯道的合适车速。
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    - $ref: '#/macros/icbm_scc_not_engaged'
  - key: SmartCruiseControlMap
    widget: toggle
    title: 地图
    description: 用地图数据估算前方弯道的合适车速。
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    - $ref: '#/macros/icbm_scc_not_engaged'
- id: carrot_navigation
  title: OSM / Carrot 导航
  description: 手机互联、导航数据与动态巡航调校
  enablement:
  - $ref: '#/macros/offroad'
  items:
  - key: OsmMapDataEnabled
    widget: toggle
    title: 启用 OSM 地图数据
    description: 使用离线 OSM 地图数据提供限速与道路名。关闭则完全忽略离线地图——离线数据可能已过时多年。
  - key: CarrotAmapBlindSpotEnabled
    widget: toggle
    title: 启用 Carrot 盲区数据
    description: 解析 7706 UDP 流中的盲区 / 激光雷达 / 扩展转向灯字段。
  - key: CarrotEnabled
    widget: toggle
    title: 启用 Carrot 规划器
    description: 启用动态跟车距离、驾驶模式、红绿灯处理与导航巡航车速。
  - key: MyDrivingMode
    widget: multiple_button
    title: 驾驶模式
    description: Carrot 驾驶风格预设。
    options:
    - value: 1
      label: 经济
    - value: 2
      label: 安全
    - value: 3
      label: 标准
    - value: 4
      label: 高
    visibility:
    - type: param
      key: CarrotEnabled
      equals: true
  - key: TrafficLightDetectMode
    widget: multiple_button
    title: 红绿灯辅助
    description: 使用模型停止线检测时，红灯停车并可在绿灯时恢复行驶。
    options:
    - value: 0
      label: 关
    - value: 1
      label: 红灯停车
    - value: 2
      label: 红灯停 绿灯行
    visibility:
    - type: param
      key: CarrotEnabled
      equals: true
  - key: CarrotNavCruiseSpeedEnabled
    widget: toggle
    title: 导航巡航车速
    description: 用导航期望车速限制巡航设定速度。
    visibility:
    - type: param
      key: CarrotEnabled
      equals: true
  - id: carrot_tuning
    label: Carrot 调校
    trigger_key: CarrotEnabled
    trigger_condition:
      type: param
      key: CarrotEnabled
      equals: true
    items:
    - key: CruiseGapLevels
      widget: option
      title: 巡航跟车档位
      description: 车距按键循环的跟车档位数（2-4 档）。低于车型上限会缩短循环。
      min: 2
      max: 4
      step: 1
    - key: TFollowGap1
      widget: option
      title: 跟车档 1
      min: 0.5
      max: 3.0
      step: 0.05
    - key: TFollowGap2
      widget: option
      title: 跟车档 2
      min: 0.5
      max: 3.0
      step: 0.05
    - key: TFollowGap3
      widget: option
      title: 跟车档 3
      min: 0.5
      max: 3.0
      step: 0.05
    - key: TFollowGap4
      widget: option
      title: 跟车档 4
      min: 0.5
      max: 3.0
      step: 0.05
