# Page: cruise
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: cruise
label: Cruise
icon: cruise_control
order: 2
remote_configurable: true
description: Longitudinal control, speed limits, and cruise behavior
sections:
- id: core_cruise_features
  title: ''
  description: ''
  items:
  - key: ExperimentalMode
    widget: toggle
    title: Experimental Mode
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DynamicExperimentalControl
    widget: toggle
    title: Dynamic Experimental Control
    description: Let the model decide when to use sunnypilot ACC or sunnypilot End to End Longitudinal.
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: DisengageOnAccelerator
    widget: toggle
    title: Disengage Cruise on Accelerator Pedal
    description: When enabled, pressing the accelerator pedal will disengage longitudinal control.
  - key: LongitudinalPersonality
    widget: multiple_button
    title: Driving Personality
    description: Standard is recommended. In aggressive mode, sunnypilot will follow lead cars closer and be more aggressive
      with the gas and brake. In relaxed mode sunnypilot will stay further away from lead cars. On supported cars, you can
      cycle through these personalities with your steering wheel distance button.
    options:
    - value: 0
      label: Aggressive
    - value: 1
      label: Standard
    - value: 2
      label: Relaxed
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: IntelligentCruiseButtonManagement
    widget: toggle
    title: Intelligent Cruise Button Management (ICBM) (Alpha)
    visibility:
    - type: capability
      field: icbm_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - type: not
      condition:
        type: capability
        field: has_longitudinal_control
        equals: true
- id: custom_acc_increments
  title: Custom ACC Speed Intervals
  description: ''
  enablement:
  - $ref: '#/macros/offroad'
  - type: any
    conditions:
    - type: all
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: not
        condition:
          type: capability
          field: pcm_cruise
          equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: CustomAccIncrementsEnabled
    widget: toggle
    title: Enable Custom ACC Speed Intervals
    enablement:
    - $ref: '#/macros/offroad'
    - type: any
      conditions:
      - type: all
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: not
          condition:
            type: capability
            field: pcm_cruise
            equals: true
      - type: capability
        field: has_icbm
        equals: true
  sub_panels:
  - id: custom_acc_intervals
    label: Custom ACC Speed Intervals Settings
    trigger_key: CustomAccIncrementsEnabled
    trigger_condition:
      type: param
      key: CustomAccIncrementsEnabled
      equals: true
    items:
    - key: CustomAccShortPressIncrement
      widget: option
      title: Short Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
    - key: CustomAccLongPressIncrement
      widget: option
      title: Long Press Increment
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
- id: speed_limits
  title: Speed Limits
  description: Speed limit detection and offset behavior
  items: []
  sub_panels:
  - id: speed_limit_settings
    label: Speed Limit Settings
    trigger_key: SpeedLimitMode
    items:
    - key: SpeedLimitMode
      widget: multiple_button
      title: Speed Limit Assist Mode
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Information
      - value: 2
        label: Warning
      - value: 3
        label: Assist
        enablement:
        - type: any
          conditions:
          - type: capability
            field: has_longitudinal_control
            equals: true
          - type: capability
            field: has_icbm
            equals: true
        - type: not
          condition:
            type: capability
            field: brand
            equals: rivian
        - type: not
          condition:
            type: all
            conditions:
            - type: capability
              field: brand
              equals: tesla
            - type: capability
              field: is_sp_release
              equals: true
    - key: SpeedLimitPolicy
      widget: multiple_button
      title: Speed Limit Source
      options:
      - value: 0
        label: Car State Only
      - value: 1
        label: Map Data Only
      - value: 2
        label: Car State Priority
      - value: 3
        label: Map Data Priority
      - value: 4
        label: Combined
    - key: SpeedLimitOffsetType
      widget: multiple_button
      title: Speed Limit Offset Type
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Fixed
      - value: 2
        label: Percentage
    - key: SpeedLimitValueOffset
      widget: option
      title: Speed Limit Offset Value
      min: -30
      max: 30
      step: 1
      unit:
        metric: km/h
        imperial: mph
      visibility:
      - type: param_compare
        key: SpeedLimitOffsetType
        op: '>'
        value: 0
- id: smart_cruise
  title: Smart Cruise Control
  description: ''
  enablement:
  - type: any
    conditions:
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: SmartCruiseControlVision
    widget: toggle
    title: Vision
    description: Use vision path predictions to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
  - key: SmartCruiseControlMap
    widget: toggle
    title: Map
    description: Use map data to estimate the appropriate speed to drive through turns ahead.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
- id: carrot_navigation
  title: Amap / Carrot Navigation
  description: Phone projection, navigation data, and dynamic cruise tuning
  enablement:
  - $ref: '#/macros/offroad'
  items:
  - key: AmapEnabled
    widget: toggle
    title: Enable Amap Map Data
    description: Use Amap (Gaode) online map data for speed limits and road names in China.
  - key: AmapNaviUdpPort
    widget: option
    title: Phone Navi UDP Port
    description: UDP port to receive navigation data from a phone app. 0 disables.
    min: 0
    max: 65535
    step: 1
    visibility:
    - type: param
      key: AmapEnabled
      equals: true
  - key: CarrotEnabled
    widget: toggle
    title: Enable Carrot Planner
    description: Enable dynamic following distance, driving modes, traffic light handling, and navigation cruise speed.
  - key: MyDrivingMode
    widget: multiple_button
    title: Driving Mode
    description: Carrot driving style preset.
    options:
    - value: 0
      label: Eco
    - value: 1
      label: Normal
    - value: 2
      label: Sport
    - value: 3
      label: Safe
    visibility:
    - type: param
      key: CarrotEnabled
      equals: true
  - key: TrafficLightDetectMode
    widget: multiple_button
    title: Traffic Light Assist
    description: Stop at red lights and optionally resume on green when using model-based stop line detection.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Red Stop
    - value: 2
      label: Red Stop + Green Go
    visibility:
    - type: param
      key: CarrotEnabled
      equals: true
  - key: CarrotCurveSpeedEnabled
    widget: toggle
    title: Navigation Curve Speed
    description: Slow down for curves using navigation route curvature.
    visibility:
    - type: param
      key: CarrotEnabled
      equals: true
  - key: CarrotNavCruiseSpeedEnabled
    widget: toggle
    title: Navigation Cruise Speed
    description: Use navigation desired speed to limit cruise set speed.
    visibility:
    - type: param
      key: CarrotEnabled
      equals: true
  - key: CarrotHudInfoEnabled
    widget: toggle
    title: Extended HUD Info
    description: Show blind spot state, side vehicle distance, and traffic light info on the HUD.
    visibility:
    - type: param
      key: CarrotEnabled
      equals: true
  sub_panels:
  - id: carrot_tuning
    label: Carrot Tuning
    trigger_key: CarrotEnabled
    trigger_condition:
      type: param
      key: CarrotEnabled
      equals: true
    items:
    - key: TFollowGap1
      widget: option
      title: Follow Gap 1
      min: 0.5
      max: 3.0
      step: 0.05
    - key: TFollowGap2
      widget: option
      title: Follow Gap 2
      min: 0.5
      max: 3.0
      step: 0.05
    - key: TFollowGap3
      widget: option
      title: Follow Gap 3
      min: 0.5
      max: 3.0
      step: 0.05
    - key: TFollowGap4
      widget: option
      title: Follow Gap 4
      min: 0.5
      max: 3.0
      step: 0.05
    - key: CruiseMaxVals0
      widget: option
      title: Max Accel 0
      min: 0.5
      max: 5.0
      step: 0.1
      unit:
        metric: m/s²
        imperial: m/s²
    - key: CruiseMaxVals1
      widget: option
      title: Max Accel 1
      min: 0.5
      max: 5.0
      step: 0.1
      unit:
        metric: m/s²
        imperial: m/s²
    - key: CruiseMaxVals2
      widget: option
      title: Max Accel 2
      min: 0.5
      max: 5.0
      step: 0.1
      unit:
        metric: m/s²
        imperial: m/s²
    - key: CruiseMaxVals3
      widget: option
      title: Max Accel 3
      min: 0.5
      max: 5.0
      step: 0.1
      unit:
        metric: m/s²
        imperial: m/s²
    - key: CruiseMaxVals4
      widget: option
      title: Max Accel 4
      min: 0.5
      max: 5.0
      step: 0.1
      unit:
        metric: m/s²
        imperial: m/s²
    - key: CruiseMaxVals5
      widget: option
      title: Max Accel 5
      min: 0.5
      max: 5.0
      step: 0.1
      unit:
        metric: m/s²
        imperial: m/s²
    - key: CruiseMaxVals6
      widget: option
      title: Max Accel 6
      min: 0.5
      max: 5.0
      step: 0.1
      unit:
        metric: m/s²
        imperial: m/s²
