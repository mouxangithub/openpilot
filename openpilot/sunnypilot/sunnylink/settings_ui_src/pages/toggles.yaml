id: toggles
label: 功能开关
icon: toggles
order: 5
remote_configurable: true
description: openpilot 核心功能开关
sections:
- id: core_toggles
  title: ''
  description: ''
  items:
  - key: OpenpilotEnabledToggle
    widget: toggle
    needs_onroad_cycle: true
    title: 启用 sunnypilot
    description: 使用 sunnypilot 系统提供自适应巡航与车道保持辅助。使用该功能期间必须始终保持注意力。
    enablement:
    - $ref: '#/macros/offroad'
  - key: IsLdwEnabled
    widget: toggle
    title: 启用车道偏离警告
    description: 车速超过 31 mph（50 km/h）时，未打转向灯而偏离检测到的车道线会提醒驶回车道。
  - key: AlwaysOnDM
    widget: toggle
    title: 常开驾驶员监测
    description: 驾驶员监测系统可开关，但建议长期开启。
  - key: DistractionDetectionLevel
    widget: multiple_button
    title: 分神检测等级
    description: 设置驾驶员分神检测的灵敏度。严格对轻微分神也警告；适中平衡；宽松仅在明显分神时提醒。
    options:
    - value: 0
      label: 严格
    - value: 1
      label: 适中
    - value: 2
      label: 宽松
    visibility:
    - type: param
      key: AlwaysOnDM
      equals: true
  - key: IsMetric
    widget: toggle
    title: 使用公制单位
    description: 以 km/h 而非 mph 显示速度。
  - key: SunnypilotStoppingController
    widget: toggle
    needs_onroad_cycle: true
    title: 停车控制器
    description: 接管停车的收尾。请求随车速降到车轮停转，然后把车保持在静止。
    enablement:
    - $ref: '#/macros/offroad'
- id: recording
  title: 录制
  description: 行驶中的相机与录音
  items:
  - key: RecordFront
    widget: toggle
    needs_onroad_cycle: true
    title: 录制并上传驾驶员相机
    description: 上传驾驶员相机数据，帮助改进驾驶员监测算法。
  - key: RecordAudio
    widget: toggle
    needs_onroad_cycle: true
    title: 录制并上传麦克风音频
    description: 行驶时录制并存储麦克风音频。音频将包含在 comma connect 的行车记录视频里。
