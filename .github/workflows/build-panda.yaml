name: build-panda

# Build panda firmware (F4 dos + H7) so the packaged tree ships
# panda/board/obj/panda.bin.signed etc. Without these, pandad's brick
# guard ("expected signature unavailable, refusing to flash") leaves
# pandas stuck in bootstub (e.g. F4 dos flashed with H7 fw by other
# forks) permanently showing "无 PANDA".

on:
  push:
    branches: [test]
    paths:
      - 'panda/**'
      - '.github/workflows/build-panda.yaml'
  workflow_dispatch:

# the commit step pushes built firmware back into the test branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # panda + opendbc_repo are submodules; SConscript imports opendbc
          # for INCLUDE_PATH and hashes can.h into the firmware version
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          arm-none-eabi-gcc --version | head -1

      - name: Install python deps
        run: |
          python3 -m pip install --break-system-packages --upgrade pip scons

      - name: Build debug firmware (F4 + H7)
        run: |
          cd panda
          # opendbc resolved from the sibling submodule for INCLUDE_PATH
          PYTHONPATH=$GITHUB_WORKSPACE/opendbc_repo scons -j$(nproc)
          ls -la board/obj/

      - name: Build release-type firmware (debug cert, RELEASE flag)
        run: |
          cd panda
          rm -f board/obj/panda.bin.signed board/obj/panda_h7.bin.signed
          PYTHONPATH=$GITHUB_WORKSPACE/opendbc_repo CERT=board/crypto/certs/debug RELEASE=1 scons -j$(nproc)
          ls -la board/obj/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panda-firmware
          path: |
            panda/board/obj/panda.bin.signed
            panda/board/obj/panda_h7.bin.signed
            panda/board/obj/bootstub.panda.bin
            panda/board/obj/bootstub.panda_h7.bin
          if-no-files-found: error

      - name: Commit firmware into the test branch
        # test-branch git clones have an empty panda/board/obj (build artifacts
        # are never tracked), so keep prebuilt copies in <repo>/panda_firmware
        # for pandad.ensure_panda_firmware() to restore at runtime.
        if: github.ref == 'refs/heads/test'
        run: |
          mkdir -p panda_firmware
          cp panda/board/obj/panda.bin.signed panda/board/obj/panda_h7.bin.signed \
             panda/board/obj/bootstub.panda.bin panda/board/obj/bootstub.panda_h7.bin \
             panda_firmware/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add panda_firmware
          if git diff --cached --quiet; then
            echo "panda firmware unchanged, nothing to commit"
          else
            git commit -m "panda: update prebuilt firmware from CI [skip ci]"
            git push origin HEAD:test
          fi
