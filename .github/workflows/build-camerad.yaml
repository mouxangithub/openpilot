name: build camerad (comma arm64)

on:
  workflow_dispatch:
  push:
    branches: [test]
    paths:
      - 'openpilot/system/camerad/**'
      - 'launch_env.sh'
      - '.github/workflows/build-camerad.yaml'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # SConstruct gates the camerad target behind COMMA_HARDWARE = isfile('/AGNOS')
          sudo touch /AGNOS
          # camerad includes <media/cam_*.h> (qcom camera UAPI), provided by
          # AGNOS on-device (/usr/include/media). Pull the same headers from
          # the kernel repo into a default compiler search path.
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/StarPilotHQ/agnos-kernel-sdm845.git /tmp/kernel
          cd /tmp/kernel && git sparse-checkout set --no-cone \
            '/include/uapi/media/**' \
            '/include/uapi/linux/v4l2-controls.h' \
            '/include/uapi/linux/videodev2.h'
          sudo cp -r include/uapi/media /usr/local/include/
          # qcom VIDC controls live in the kernel's extended v4l2 headers; place
          # them in /usr/local/include/linux which the compiler searches before
          # the distro /usr/include/linux
          sudo mkdir -p /usr/local/include/linux
          sudo cp include/uapi/linux/v4l2-controls.h include/uapi/linux/videodev2.h /usr/local/include/linux/
          # strip kernel-only __user annotations (AGNOS ships these headers pre-stripped)
          sudo sed -i 's/__user//g' /usr/local/include/media/*.h /usr/local/include/linux/v4l2-controls.h /usr/local/include/linux/videodev2.h

      - name: Build camerad
        run: |
          uv sync --frozen --extra tools
          uv run scons -j"$(nproc)" cache_dir=/tmp/scons_cache openpilot/system/camerad/camerad openpilot/system/loggerd/loggerd
          file openpilot/system/camerad/camerad openpilot/system/loggerd/loggerd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: camerad-loggerd-aarch64
          path: |
            openpilot/system/camerad/camerad
            openpilot/system/loggerd/loggerd
          if-no-files-found: error
